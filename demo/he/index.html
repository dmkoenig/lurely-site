<title>הדגמה של Lurely</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<style>
:root { color-scheme: dark; --ink: #0b2a30; --panel: #10333a; --line: #24525a; --text: #e6f1ef; --muted: #8fb3af; --lure: #ff5d8b; --lime: #e2f46a; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.5 'Instrument Sans', Arial, sans-serif; display: grid; place-items: center; padding-inline: 16px; }
form { width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
.brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.brand svg { width: 26px; height: 26px; color: var(--lure); }
.brand span { font: 900 24px/1 'Archivo', sans-serif; }
h1 { font: 800 24px/1.15 'Archivo', sans-serif; margin: 0 0 8px; }
p { color: var(--muted); margin: 0 0 18px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
input[type=password] { width: 100%; font: 16px 'JetBrains Mono', monospace; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink); color: var(--text); }
input[type=password]:focus { outline: 2px solid var(--lime); outline-offset: 1px; }
.rem { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin: 12px 0 18px; }
button { width: 100%; font: 700 16px 'Instrument Sans', sans-serif; padding: 12px; border: 0; border-radius: 10px; background: var(--lure); color: #1a0510; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
.err { color: #ff8f8f; font-size: 13.5px; min-height: 20px; margin: 10px 0 0; }
.small { font-size: 12.5px; margin: 16px 0 0; }
</style>
</head>

const K = "lurely-demo-pw";
const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(P.salt), iterations: 600000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(P.iv) }, key, u8(P.ct)));
  document.open(); document.write(html); document.close();
}
const store = { get() { try { return sessionStorage.getItem(K) || localStorage.getItem(K); } catch { return null; } },
  set(pw, remember) { try { sessionStorage.setItem(K, pw); if (remember) localStorage.setItem(K, pw); } catch {} },
  clear() { try { sessionStorage.removeItem(K); localStorage.removeItem(K); } catch {} } };
const saved = store.get();
if (saved) open(saved).catch(() => store.clear());
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "פותח…"; err.textContent = "";
  try { store.set(pw, document.getElementById("rem").checked); await open(pw); }
  catch { store.clear(); err.textContent = "סיסמה שגויה. בדקו ונסו שוב."; btn.disabled = false; btn.textContent = "פתיחת ההדגמה"; }
});
</script>
